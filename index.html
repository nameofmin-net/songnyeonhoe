<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 송년회 광장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
  :root { --bg: #110d18; --panel: #1a1426; --line: #3a2f52; --ink: #f4eefc; --dim: #9a90b0; --accent: #ffd84a; --red: #b8332f; --m: #a8d4ff; --f: #ffc2dc; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Galmuri14, "Apple SD Gothic Neo", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 8px 12px; overflow: hidden; }
  .row { display: flex; gap: 12px; align-items: stretch; justify-content: center; max-width: 100%; }
  #stage { position: relative; flex: none; box-shadow: 0 0 0 3px #1c1624, 0 0 0 6px var(--line), 0 20px 60px #000a; }
  /* OX 퀴즈 문제 띠 */
  #quizBar { position: absolute; left: 2cqw; top: 2.5cqh; z-index: 4; display: flex; flex-direction: column; align-items: center; gap: .6cqh; padding: 1.2cqh 3cqw; background: #f6ead0; color: #1c1624; border: .4cqw solid #1c1624; box-shadow: 0 .6cqh 0 #1c1624; max-width: 34cqw; text-align: center; pointer-events: none; }
  #quizBar[hidden] { display: none; }
  #quizBar small { font-size: 1.5cqw; color: #c8327a; letter-spacing: .1em; }
  #quizBar b { font-size: 2.6cqw; line-height: 1.35; word-break: keep-all; }
  #quizBar span { font-size: 1.5cqw; color: #6a5a4a; }
  #quizBar .ans { font-style: normal; font-size: 3.6cqw; font-weight: bold; animation: callPop .5s cubic-bezier(.22,1,.36,1); }
  #quizBar .ans.o { color: #2f6ad8; } #quizBar .ans.x { color: #d83a3a; }
  @keyframes callPop { from { transform: scale(1.6); opacity: 0; } to { transform: none; opacity: 1; } }
  /* 시상식 무대: 빨간 커튼 */
  #stage { container-type: size; }
  #show { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  #show .curtain { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  #show .pp { position: relative; visibility: hidden; }
  #show .pp.go { visibility: visible; }
  #show .pp canvas { position: static; inset: auto; width: auto; height: var(--ph, 15cqh); aspect-ratio: 18 / 28; image-rendering: pixelated; filter: drop-shadow(0 0 1.2cqw #ffd84a55); display: block; }
  #show .pp b { opacity: 0; transition: opacity .4s; }
  #show .pp.here b { opacity: 1; }
  #show .pp .bub { position: absolute; bottom: calc(100% + .6cqh); left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: var(--pf, 2.2cqw); background: #fff; color: #1c1624; padding: .4cqh .9cqw; box-shadow: 0 0 0 .25cqw #1c1624; opacity: 0; transition: opacity .25s, transform .25s; z-index: 2; }
  #show .pp .bub.on { opacity: 1; transform: translateX(-50%) translateY(-.5cqh); }
  #show .pp .emo { position: absolute; left: 50%; top: -1cqh; font-size: calc(var(--pf, 2.2cqw) * 1.6); transform: translateX(-50%); opacity: 0; pointer-events: none; }
  #show .pp .emo.on { animation: emoUp 1.4s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes emoUp { 0% { opacity: 0; transform: translate(-50%, 1cqh) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -2cqh) scale(1); } 100% { opacity: 0; transform: translate(-50%, -7cqh) scale(1); } }
  #show .cur { position: absolute; top: 0; bottom: 0; width: 51%; transition: transform 1.05s cubic-bezier(.65,0,.35,1);
    background: linear-gradient(180deg, #0000 0 88%, #0006 100%), repeating-linear-gradient(90deg, #6a0a12 0 1.2%, #a8141f 1.2% 3.4%, #d8323a 3.4% 4.6%, #b81d2a 4.6% 6.4%, #7a0d16 6.4% 7.6%); }
  #show .cur.l { left: 0; transform: translateX(-112%); box-shadow: inset -1.2cqw 0 1.5cqw #0008; }
  #show .cur.r { right: 0; transform: translateX(112%); box-shadow: inset 1.2cqw 0 1.5cqw #0008; }
  #show .cur::after { content: ""; position: absolute; top: 0; bottom: 0; width: 1cqw; background: repeating-linear-gradient(180deg, #ffd84a 0 3%, #c8941a 3% 5%); }
  #show .cur.l::after { right: 0; } #show .cur.r::after { left: 0; }
  #show.closed .cur { transform: none; }
  #show .valance { position: absolute; left: 0; right: 0; top: 0; height: 9cqh; transform: translateY(-105%); transition: transform .7s cubic-bezier(.25,1,.5,1);
    background: radial-gradient(circle at 50% 0, #d8323a 62%, #0000 64%) 0 0 / 8cqw 9cqh repeat-x; border-top: .8cqh solid #ffd84a; filter: drop-shadow(0 .6cqh 0 #c8941a) drop-shadow(0 1cqh .8cqh #0008); }
  #show.closed .valance { transform: none; }
  #show .sh-back { position: absolute; inset: 0; opacity: 0; transition: opacity .3s;
    background: radial-gradient(ellipse 30% 70% at 30% 0, #fff3c022, #0000 70%), radial-gradient(ellipse 30% 70% at 70% 0, #fff3c022, #0000 70%), radial-gradient(ellipse 60% 50% at 50% 55%, #3a1a3a, #120a18 80%); }
  #show.on .sh-back { opacity: 1; }
  #show .sh-card { position: absolute; inset: 9cqh 4cqw 3cqh; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 2.4cqh; text-align: center; color: #f4eefc; }
  #show.on .sh-card { display: flex; }
  #show .sh-t { font-size: 7.2cqw; font-weight: bold; color: #ffd84a; text-shadow: 0 .5cqw 0 #8a3a10, 0 0 3cqw #ffb84a88; letter-spacing: .05em; transition: font-size .6s cubic-bezier(.25,1,.5,1); word-break: keep-all; line-height: 1.25; }
  #show .sh-t small { display: block; font-size: 2.1cqw; color: #ffc2dc; letter-spacing: .3em; margin-bottom: 1.2cqh; text-shadow: none; font-weight: normal; }
  #show .sh-s { font-size: 3.6cqw; color: #fff; padding: .8cqh 3cqw; border: .35cqw solid #ffd84a; background: #1c1624cc; display: none; }
  #show .ppl { display: none; flex-wrap: wrap; justify-content: center; gap: 7cqh 2.2cqw; max-width: 92cqw; margin-top: 6cqh; }
  #show .pp { display: flex; flex-direction: column; align-items: center; gap: .6cqh; }
  #show .pp img { height: var(--ph, 15cqh); image-rendering: pixelated; filter: drop-shadow(0 0 1.2cqw #ffd84a66); }
  #show .pp b { font-size: var(--pf, 2.2cqw); font-weight: normal; background: #1c1624dd; padding: .2cqh .8cqw; }
  #show .pp b small { color: #9a90b0; margin-left: .4cqw; font-size: .8em; }
  #show.s1 .sh-t, #show.s2 .sh-t { font-size: 4.6cqw; }
  #show.s1 .sh-s, #show.s2 .sh-s { display: block; animation: shIn .6s cubic-bezier(.25,1,.5,1) both; }
  #show.s1 .ppl, #show.s2 .ppl { display: flex; }
  #show .sh-congrats { display: none; position: absolute; left: 0; right: 0; bottom: -1cqh; font-size: 3.2cqw; color: #ff8ad8; text-shadow: 0 .3cqw 0 #1c1624; }
  #show.s2 .sh-congrats { display: block; animation: shIn .5s cubic-bezier(.25,1,.5,1) both; }
  #show .sh-conf { position: absolute; inset: 0; }
  #show .sh-conf i { position: absolute; top: -4%; width: 1.1cqw; height: 1.8cqh; animation: fall linear forwards; }
  @keyframes shIn { from { opacity: 0; transform: translateY(2cqh); } to { opacity: 1; transform: none; } }
  @keyframes ppIn { to { opacity: 1; transform: none; } }
  @keyframes ppHop { to { transform: translateY(-1.2cqh); } }
  @keyframes fall { to { transform: translateY(110cqh) rotate(720deg); } }
  /* 상금(공로상) */
  #show .sh-prize { display: none; font-size: 3cqw; color: #fff3c0; font-weight: bold; }
  #show.s1 .sh-prize, #show.s2 .sh-prize { display: block; animation: shIn .6s cubic-bezier(.25,1,.5,1) both; }
  /* 올해의 유플리더스: 공로상과 같은 무대 톤 + 스포트라이트 발표 */
  #show.up .sh-card { inset: 9cqh 4cqw 3cqh; display: none; }
  #show.up.on .sh-card { display: block; }
  #show .up-p { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.6cqh; opacity: 0; visibility: hidden; transition: opacity .6s; text-align: center; }
  #show.s0 .up-0, #show.s1 .up-1, #show.s2 .up-2, #show.s3 .up-2 { opacity: 1; visibility: visible; }
  #show.up .sh-t { font-size: 7cqw; }
  #show.up .sh-t.sm { font-size: 3.6cqw; }
  #show.up .sh-prize { display: block; }
  #show .up-desc { margin: 0; font-size: 2cqw; line-height: 1.9; color: #e8deff; word-break: keep-all; max-width: 64cqw; }
  #show .up-c { display: flex; margin-top: 4cqh; }
  #show .up-c .pp { transition: opacity .8s, filter .8s; }
  #show .up-c .pp.lose { opacity: 0; filter: brightness(.3); }
  #show .up-c .pp.win canvas { filter: drop-shadow(0 0 2cqw #ffd84a); }
  #show .dimmer { position: absolute; inset: -9cqh -4cqw -3cqh; background: #06030ce0; opacity: 0; transition: opacity .8s; z-index: 3; pointer-events: none; }
  #show .up-2.dark .dimmer { opacity: 1; }
  #show .cone { position: absolute; left: -16cqh; top: -9cqh; width: 32cqh; opacity: 0; transition: opacity .6s; z-index: 4; pointer-events: none; mix-blend-mode: screen;
    clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%); background: linear-gradient(180deg, #fff6d0 0%, #ffe9a0aa 30%, #ffd86a55 100%); }
  #show .cone::after { content: ""; position: absolute; left: 0; right: 0; bottom: -3cqh; height: 6cqh; border-radius: 50%; background: #fff3c066; }
  #show .up-2:not(.dark) .cone { opacity: 0 !important; }
  #show .up-c { position: relative; z-index: 5; }
  #show .up-c .pp.lit canvas { filter: brightness(1.25) drop-shadow(0 0 1.5cqw #fff3c0); }
  #show .up-2.done .cone, #show .up-2.done .dimmer, #show .up-2.done .up-c, #show .up-2.done > .sh-t { display: none; }
  #show .sh-prize { position: relative; }
  #show .coins { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
  @keyframes spin { to { background-position: -400% 0; } }
  #show .coins i { position: absolute; left: -1.2cqw; top: -1.2cqw; width: 2.4cqw; height: 2.4cqw; background: var(--coin) 0 0 / 400% 100%; image-rendering: pixelated; animation: spin .36s steps(4) infinite; }
  #show .up-win { display: none; flex-direction: column; align-items: center; gap: 1.8cqh; }
  #show .up-2.done .up-win { display: flex; animation: zoomIn .9s cubic-bezier(.22,1,.36,1) both; }
  @keyframes zoomIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
  #show .up-frame { padding: 1.6cqh 3cqh; border: .5cqw solid #ffd84a; box-shadow: 0 0 0 .35cqw #8a3a10, 0 0 0 .9cqw #1c1624; background: #2a1a3a; }
  #show .up-frame canvas { position: static; inset: auto; width: auto; height: 30cqh; aspect-ratio: 18 / 28; image-rendering: pixelated; display: block; }
  #show .up-name { font-size: 4cqw; color: #fff; font-weight: bold; }
  #show .up-name small { font-size: .55em; color: #9a90b0; margin-left: .6cqw; font-weight: normal; }
  #stage.hit { animation: hit .28s cubic-bezier(.25,1,.5,1); }
  @keyframes hit { 0%,100% { transform: none; } 20% { transform: translate(-5px, 3px); } 45% { transform: translate(4px, -3px); } 70% { transform: translate(-2px, 1px); } }
  #stage.boom { animation: boom .7s cubic-bezier(.25,1,.5,1); }
  @keyframes boom { 0%,100% { transform: none; } 10% { transform: translate(-8px, 4px); } 25% { transform: translate(7px, -5px); } 40% { transform: translate(-5px, 3px); } 60% { transform: translate(3px, -2px); } 80% { transform: translate(-1px, 1px); } }
  #stage canvas { position: absolute; inset: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  #overlay { cursor: pointer; }
  .bar[hidden], .hint[hidden] { display: none !important; }

  /* 좌우 명단 */
  .col { flex: none; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .col.left { width: 236px; } .col.right { width: 300px; }
  .col .panel { width: 100%; flex: 1 1 0; }
  .panel { width: 224px; flex: none; overflow: hidden; display: flex; flex-direction: column; background: var(--panel); border: 3px solid var(--line); box-shadow: 0 0 0 3px #1c1624; min-height: 0; }
  .panel h2 { margin: 0; padding: 12px 14px 10px; font-size: 14px; font-weight: normal; display: flex; align-items: baseline; justify-content: space-between; border-bottom: 2px solid var(--line); }
  .panel h2 b { font-size: 22px; color: var(--accent); font-weight: bold; }
  .panel.wait h2 b { color: var(--dim); }
  .panel .sub { padding: 6px 14px; font-size: 11px; color: var(--dim); border-bottom: 1px solid #2a2240; }
  .panel ul { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .panel li { display: flex; align-items: center; gap: 8px; padding: 5px 6px; font-size: 13px; }
  .panel li img { width: 27px; height: 25px; image-rendering: pixelated; flex: none; }
  .panel.wait li { opacity: 0.55; }
  .panel.wait ul { display: grid; grid-template-columns: 1fr 1fr; align-content: start; }
  .panel.wait li { padding: 3px 4px; font-size: 12px; }
  .panel.pres li { align-items: flex-start; border-bottom: 1px dashed #2a2240; }
  .panel.pres li p { margin: 3px 0 0; font-size: 11px; color: #d8cfe8; line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
  .panel.pres li.new { animation: flash 2.4s ease-out; }
  .panel.chat ul { padding: 8px; }
  .panel.chat h2 .cnt { font-size: 11px; color: var(--dim); }
  .panel.chat .sub { border-bottom: 0; border-top: 2px solid var(--line); text-align: center; }
  .col .panel.qrbox { flex: none; }
  .panel .qr { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #2a2140; }
  .panel .qr img { width: 64px; height: 64px; background: #fff; padding: 3px; flex: none; image-rendering: pixelated; }
  .panel .qr span { font-size: 11px; color: #d8cfe8; line-height: 1.5; }
  .panel .qr b { display: block; font-size: 15px; color: var(--accent); margin-bottom: 2px; animation: qrb 1.6s ease-in-out infinite; }
  @keyframes qrb { 50% { opacity: .55; } }
  .panel.chat li.empty { flex-direction: column; }
  .panel.chat .ci { padding: 5px 2px; align-items: flex-start; }
  .panel.chat .ci.new { animation: flash 2s ease-out; }
  .panel.wait li.empty { grid-column: 1 / -1; opacity: 1; }
  .panel li.empty { color: var(--dim); font-size: 12px; line-height: 1.6; justify-content: center; text-align: center; padding: 24px 8px; border: 0; }
  .nm.M { color: var(--m); } .nm.F { color: var(--f); }
  @keyframes flash { 0% { background: #ffd84a55; } 100% { background: transparent; } }

  /* 입장 알림 */
  #announce { position: absolute; left: 50%; bottom: 6%; transform: translate(-50%, -30px); opacity: 0; pointer-events: none; display: flex; gap: 14px; align-items: center; padding: 12px 22px 12px 14px; background: #1c1624ee; border: 3px solid var(--accent); box-shadow: 0 0 0 3px #1c1624, 0 12px 30px #000a; max-width: 80%; }
  #announce.on { animation: ann 4.2s cubic-bezier(.25,1,.5,1) forwards; }
  #announce img { width: 36px; height: 56px; image-rendering: pixelated; flex: none; }
  #announce b { font-size: 18px; display: block; }
  #announce b .M { color: var(--m); } #announce b .F { color: var(--f); }
  #announce p { margin: 6px 0 0; font-size: 15px; color: #fff3c0; word-break: keep-all; }
  @keyframes ann { 0% { opacity: 0; transform: translate(-50%, -30px) scale(.9); } 10% { opacity: 1; transform: translate(-50%, 0) scale(1); } 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -12px); } }

  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 13px; }
  button { font: inherit; font-size: 13px; color: var(--ink); background: #2a2140; border: 2px solid #4a3f6a; padding: 7px 12px; cursor: pointer; box-shadow: 0 3px 0 #0008; }
  button:hover { background: #3a2f58; }
  button#joinBtn { background: var(--accent); color: #1c1624; border-color: #fff3b0; font-size: 14px; }
  button#cheers { background: var(--red); border-color: #ff7a6a; }
  .hint { color: var(--dim); font-size: 11px; }
  .hint a { color: var(--dim); }
  #live { color: #c9a0a0; } #live.on { color: #7fe0a0; }
  [hidden] { display: none !important; }

  /* 팝업 */
  #modal { position: fixed; inset: 0; background: #07050cbb; display: none; place-items: center; z-index: 10; padding: 16px; }
  #modal.on { display: grid; }
  .sheet { position: relative; width: min(380px, 100%); background: var(--panel); border: 3px solid var(--line); box-shadow: 0 0 0 3px #1c1624, 0 30px 80px #000c; padding: 20px; }
  #modalClose { position: absolute; top: 8px; right: 8px; padding: 2px 9px; box-shadow: none; }

  body.narrow { overflow: auto; justify-content: flex-start; }
  body.narrow .row { flex-wrap: wrap; }
  body.narrow .col { width: calc(50% - 6px); height: 420px; order: 2; }
  body.narrow #stage { order: 1; }
</style>
</head>
<body>
  <div class="row" id="row">
    <div class="col left">
      <section class="panel pres">
        <h2>송년회 참석 중 <b id="presN">0</b></h2>
        <div class="sub" id="presMF">남 0 · 여 0</div>
        <ul id="presList" class="auto"></ul>
      </section>
      <section class="panel qrbox">
        <div class="qr"><img src="qr.svg" alt="입장 QR"><span><b>QR 찍고 입장!</b>휴대폰으로 찍으면<br>광장에 내 캐릭터 등장</span></div>
      </section>
      <section class="panel wait">
        <h2>아직 도착 전 <b id="waitN">0</b></h2>
        <ul id="waitList" class="auto"></ul>
      </section>
    </div>
    <div id="stage">
      <canvas id="world"></canvas><canvas id="overlay"></canvas>
      <div id="announce"></div>
      <div id="quizBar" hidden></div>
      <div id="show"><div class="sh-back"></div><div class="sh-card"></div><div class="sh-conf"></div><canvas class="curtain"></canvas><div class="valance"></div></div>
    </div>
    <div class="col right">
      <section class="panel chat">
        <h2>실시간 채팅 <span class="cnt" id="chatN"></span></h2>
        <ul id="chatList"></ul>
        <div class="sub">휴대폰으로 입장하면 채팅할 수 있어요</div>
      </section>
    </div>
  </div>
  <div class="bar" hidden>
    <button id="joinBtn">✋ 입장하기</button>
    <button id="rand5">🎲 랜덤 5명 입장</button>
    <button id="cheers">🥂 다 같이 건배</button>
    <button id="sound">🔇 캐롤·효과음 켜기</button>
    <button id="reset">↺ 초기화</button>
  </div>

.jf { display: flex; flex-direction: column; gap: 14px; font-family: Galmuri14, "Apple SD Gothic Neo", sans-serif; color: #f4eefc; }
.jf-head { display: flex; align-items: center; gap: 14px; }
.jf-av { width: 72px; height: 112px; flex: none; display: grid; place-items: center; background: #1c1630; border: 2px solid #4a3f6a; }
.jf-av img { width: 54px; height: 84px; image-rendering: pixelated; }
.jf-av .q { color: #6a5f8a; font-size: 28px; }
.jf-title { font-size: 18px; line-height: 1.4; }
.jf-title small { display: block; color: #9a90b0; font-size: 12px; margin-top: 4px; }
.jf label, .jf .lab { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #c9c0dc; }
.jf select, .jf textarea { font: inherit; font-size: 16px; color: #f4eefc; background: #15101f; border: 2px solid #4a3f6a; padding: 10px 12px; border-radius: 0; width: 100%; }
.jf select:focus, .jf textarea:focus { outline: none; border-color: #ffd84a; }
.jf textarea { resize: none; height: 72px; line-height: 1.5; }
.jf .cnt { align-self: flex-end; font-size: 11px; color: #7a7090; }
.jf .btn, .mob .btn { font: inherit; font-size: 16px; padding: 12px; color: #1c1624; background: #ffd84a; border: 2px solid #fff3b0; box-shadow: 0 4px 0 #8a6a10; cursor: pointer; }
.jf .btn:disabled, .mob .btn:disabled { background: #4a3f6a; border-color: #5a4f7a; color: #9a90b0; box-shadow: none; cursor: default; }
.jf .btn.sub, .mob .btn.sub { background: #2a2140; color: #f4eefc; border-color: #4a3f6a; box-shadow: 0 3px 0 #0008; font-size: 14px; padding: 10px; }
.jf .note { font-size: 13px; line-height: 1.5; padding: 10px 12px; background: #2a2140; border: 1px solid #5a4a30; color: #fff3c0; }
.jf .note:empty { display: none; }
.jf .msg { text-align: center; font-size: 13px; color: #ffd84a; min-height: 1.2em; }
/* 내 캐릭터 */
.me-stage { display: flex; gap: 16px; align-items: center; }
.me-pv { width: 108px; height: 156px; flex: none; display: grid; place-items: center; background: radial-gradient(#2c2444, #1a1428); border: 2px solid #4a3f6a; }
.me-pv canvas { width: 120px; height: 138px; image-rendering: pixelated; }
.me-name { font-size: 22px; } .me-name.M { color: #a8d4ff; } .me-name.F { color: #ffc2dc; }
.me-sub { font-size: 12px; color: #9a90b0; margin-top: 6px; line-height: 1.5; }
.sec { border-top: 2px solid #2e2546; padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.sec h3 { margin: 0; font-size: 14px; font-weight: normal; color: #ffd84a; }
.row2 { display: flex; gap: 8px; }
.row2 .btn { flex: 1; }
.parts { display: flex; flex-direction: column; gap: 14px; }
.opt { display: flex; flex-direction: column; gap: 6px; }
.opt > span { font-size: 12px; color: #9a90b0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; color: #d8cfe8; background: #15101f; border: 2px solid #3a2f52; padding: 6px 10px; cursor: pointer; }
.chip.on { color: #1c1624; background: #ffd84a; border-color: #fff3b0; }
.tabs { display: flex; gap: 0; border: 2px solid #4a3f6a; }
.tabs button { flex: 1; font: inherit; font-size: 14px; padding: 10px; color: #9a90b0; background: #15101f; border: 0; cursor: pointer; }
.tabs button.on { color: #1c1624; background: #ffd84a; }
.tabs button:not(.on).sp { color: #ff8ad8; }
.spgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.spcard { font: inherit; text-align: left; color: #d8cfe8; background: #15101f; border: 2px solid #3a2f52; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.spcard b { font-size: 14px; font-weight: normal; color: #f4eefc; }
.spcard small { font-size: 11px; color: #9a90b0; line-height: 1.4; }
.spcard.on { border-color: #ffd84a; background: #2a2140; box-shadow: 0 0 0 2px #ffd84a55; }
.spcard.on b { color: #ffd84a; }
.spnote { font-size: 12px; color: #ff8ad8; line-height: 1.5; padding: 8px 10px; background: #2a1830; border: 1px solid #5a3050; }
.sw { width: 30px; height: 30px; border: 2px solid #3a2f52; cursor: pointer; padding: 0; }
.sw.on { border-color: #fff; outline: 2px solid #ffd84a; outline-offset: 1px; }
/* 채팅 공통 */
.ci { display: flex; gap: 8px; align-items: flex-start; padding: 6px 4px; }
.ci img { width: 27px; height: 25px; image-rendering: pixelated; flex: none; margin-top: 2px; }
.ci .cb { min-width: 0; }
.ci .cn { font-size: 12px; display: flex; gap: 6px; align-items: baseline; }
.ci .cn.M { color: #a8d4ff; } .ci .cn.F { color: #ffc2dc; }
.ci time { font-size: 10px; color: #6a6084; }
.rk { font-size: 10px; color: #9a90b0; margin-left: 3px; }
.ci p { margin: 3px 0 0; font-size: 14px; line-height: 1.45; color: #f4eefc; background: #2a2140; padding: 6px 10px; display: inline-block; word-break: keep-all; overflow-wrap: anywhere; }
.ci.mine { flex-direction: row-reverse; text-align: right; }
.ci.mine .cn { justify-content: flex-end; }
.ci.mine p { background: #ffd84a; color: #1c1624; }
.ce { display: flex; align-items: center; gap: 6px; padding: 3px 4px; font-size: 12px; color: #9a90b0; }
.ce img { width: 18px; height: 17px; image-rendering: pixelated; }
.ce .M { color: #a8d4ff; } .ce .F { color: #ffc2dc; }
.ce.mine { justify-content: flex-end; }
/* 모바일: 입장 후 채팅 화면 */
.mob { height: 100dvh; display: flex; flex-direction: column; font-family: Galmuri14, "Apple SD Gothic Neo", sans-serif; color: #f4eefc; }
.mob-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #1a1426; border-bottom: 2px solid #3a2f52; flex: none; }
.mob-head img { width: 36px; height: 56px; image-rendering: pixelated; }
.mob-head .who { flex: 1; min-width: 0; }
.mob-head .who b { font-size: 17px; display: block; } .mob-head .who b.M { color: #a8d4ff; } .mob-head .who b.F { color: #ffc2dc; }
.mob-head .who small { font-size: 11px; color: #9a90b0; }
.mob-head .btn { padding: 8px 12px; font-size: 13px; }
.mob-quiz { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px 16px; text-align: center; background: #e8d6b0; color: #3a2a1a; }
.mob-quiz[hidden] { display: none; }
.mob.quizzing .mob-chat, .mob.quizzing .mob-in { display: none; }
.qz-n { font-size: 14px; color: #c8327a; letter-spacing: .1em; }
.qz-q { font-size: 22px; line-height: 1.5; word-break: keep-all; color: #1c1624; }
.qz-btns { display: flex; gap: 16px; width: 100%; }
.qz-btns button { flex: 1; aspect-ratio: 1; font: inherit; font-size: 72px; line-height: 1; border: 4px solid #1c1624; box-shadow: 0 6px 0 #1c1624; cursor: pointer; color: #fff; }
.qz-btns .o { background: #2f6ad8; } .qz-btns .x { background: #d83a3a; }
.qz-btns button.on { transform: translateY(4px); box-shadow: 0 2px 0 #1c1624; outline: 4px solid #ffd84a; }
.qz-btns button:disabled { opacity: .35; } .qz-btns button.ans { opacity: 1; outline: 5px solid #5ae08a; }
.qz-st { font-size: 15px; min-height: 1.4em; } .qz-st .ok { color: #1a8a3a; font-size: 20px; } .qz-st .ng { color: #c81e2a; font-size: 20px; }
.qz-end { font-size: 22px; line-height: 1.6; } .qz-end small { font-size: 14px; color: #6a5a4a; }
.mob-admin { display: flex; gap: 6px; padding: 6px 10px; border-bottom: 1px solid #ffffff14; }
.mob-admin .btn { flex: 1; padding: 8px 6px; font-size: 13px; }
.mob-head .btn.ctl-btn { padding: 6px 10px; font-size: 20px; }
.mob-chat { flex: 1; overflow-y: auto; padding: 8px 10px; list-style: none; margin: 0; }
.mob-chat .empty { color: #7a7090; text-align: center; padding: 40px 10px; font-size: 13px; line-height: 1.6; }
.mob-emo { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px 0; background: #1a1426; border-top: 2px solid #3a2f52; flex: none; scrollbar-width: none; }
.mob-emo button { flex: none; font: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 52px; padding: 6px 4px; background: #241c36; color: #d8cfe8; border: 2px solid #3a2f52; cursor: pointer; font-size: 11px; }
.mob-emo button i { font-style: normal; font-size: 22px; line-height: 1; }
.mob-emo button:active, .mob-emo button.on { background: #ffd84a; color: #1c1624; border-color: #fff3b0; }
.mob-emo + .mob-in { border-top: 0; }
.mob-head img.hop { animation: hop .6s ease-out; }
@keyframes hop { 0%,100% { transform: translateY(0); } 30% { transform: translateY(-10px); } 60% { transform: translateY(0); } 80% { transform: translateY(-4px); } }
.mob-in { display: flex; gap: 8px; padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); background: #1a1426; border-top: 2px solid #3a2f52; flex: none; }
.mob-in input { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: #f4eefc; background: #15101f; border: 2px solid #4a3f6a; padding: 10px 12px; border-radius: 0; }
.mob-in input:focus { outline: none; border-color: #ffd84a; }
.mob-in .btn { padding: 10px 16px; font-size: 15px; }
.mob-sheet { position: fixed; inset: 0; background: #110d18; overflow-y: auto; padding: 0 16px 24px; z-index: 5; }
.mob-sheet[hidden] { display: none; }
.mob-sheet .close { position: fixed; top: 12px; right: 12px; z-index: 3; padding: 6px 10px; font-size: 13px; }
/* 스크롤해도 내 캐릭터 미리보기는 위에 고정 */
.mob-sheet .me-stage { position: sticky; top: 0; z-index: 2; background: #110d18; margin: 0 -16px; padding: 14px 16px 12px; border-bottom: 2px solid #2e2546; box-shadow: 0 8px 16px #110d18; }
.mob-sheet .me-stage .me-pv { width: 84px; height: 120px; }
.mob-sheet .me-stage .me-pv canvas { width: 84px; height: 97px; }
.mob-sheet .me-stage > div:last-child { padding-right: 64px; }

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>관리자 지정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #110d18; color: #f4eefc; font-family: Galmuri14, "Apple SD Gothic Neo", sans-serif; }
  body { display: flex; justify-content: center; padding: 24px 16px 40px; }
  .card { width: min(460px, 100%); background: #1a1426; border: 3px solid #3a2f52; box-shadow: 0 0 0 3px #1c1624; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  h1 { margin: 0 0 4px; font-size: 20px; color: #ffd84a; }
  h2 { margin: 14px 0 0; font-size: 15px; } h2 b { color: #1c1624; background: #ff5a6a; padding: 0 6px; font-size: 12px; }
  h2 b:empty { display: none; }
  p { margin: 0; font-size: 13px; color: #c9c0dc; line-height: 1.6; } .hint { font-size: 12px; color: #9a90b0; }
  input { font: inherit; font-size: 16px; color: #f4eefc; background: #15101f; border: 2px solid #4a3f6a; padding: 10px 12px; width: 100%; border-radius: 0; -webkit-appearance: none; }
  input:focus { outline: none; border-color: #ffd84a; }
  .msg { font-size: 13px; color: #ff8a8a; min-height: 1.2em; }
  .btn { font: inherit; font-size: 14px; padding: 8px 12px; color: #1c1624; background: #ffd84a; border: 2px solid #fff3b0; box-shadow: 0 3px 0 #8a6a10; cursor: pointer; }
  .btn.sub { background: #2a2140; color: #f4eefc; border-color: #4a3f6a; box-shadow: 0 3px 0 #0008; }
  .btn.ok { background: #5ae08a; border-color: #b8f4cc; box-shadow: 0 3px 0 #1f7a42; }
  .btn:active { transform: translateY(2px); box-shadow: none; }
  .btn:disabled { opacity: .5; }
  #go, #out { align-self: stretch; padding: 12px; margin-top: 6px; }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .list li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: #221a36; border: 2px solid #3a2f52; }
  .list li img { width: 24px; height: 36px; image-rendering: pixelated; }
  .list li span { flex: 1; font-size: 15px; } .list li small { margin-left: 6px; font-size: 11px; color: #9a90b0; }
  .list li em { font-style: normal; font-size: 11px; color: #9a90b0; }
  .list li.empty { justify-content: center; color: #7a7090; font-size: 13px; padding: 10px; }
  #reqs li:not(.empty) { border-color: #ffd84a; }
</style>
</head>
